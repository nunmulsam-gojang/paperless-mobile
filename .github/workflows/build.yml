name: Build APK
on:
  workflow_dispatch:
  push:
    branches: [zh-cn]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.35.4
          cache: true
      - name: Generate code
        run: |
          if [ -d packages/paperless_api ]; then
            cd packages/paperless_api
            dart pub get
            dart run build_runner build --delete-conflicting-outputs
            cd ../..
          fi
          flutter pub get
          dart run build_runner build --delete-conflicting-outputs
          flutter gen-l10n
      - name: Use debug signing
        run: sed -i 's/signingConfigs.release/signingConfigs.debug/; s/getByName("release")/getByName("debug")/' android/app/build.gradle*
      - name: Change app id
        run: |
          sed -i -E 's/(applicationId\s*=?\s*")[^"]+"/\1de.astubenbord.paperless_zh"/' android/app/build.gradle*
          grep -n applicationId android/app/build.gradle*
      - run: flutter build apk --release
      - uses: actions/upload-artifact@v4
        with:
          name: paperless-zh
          path: build/app/outputs/flutter-apk/app-release.apk
